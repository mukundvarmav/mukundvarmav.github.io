<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traditional Architecture</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    color:white;
    min-height:100vh;

    background:
        linear-gradient(
            rgba(0,0,0,0.65),
            rgba(0,0,0,0.65)
        ),
        url('nalukettu-background.jpg');

    background-size:cover;
    background-position:center;
    background-attachment:fixed;
}

header{
    background:rgba(0,0,0,0.5);
    padding:25px;
    text-align:center;
}

header h1{
    color:#ffd700;
}

.content{
    max-width:1000px;
    margin:40px auto;
    padding:30px;
    background:rgba(0,0,0,0.45);
    border-radius:15px;
    backdrop-filter:blur(4px);
}

.content h2{
    color:#ffd700;
    margin-bottom:20px;
}

.content p{
    line-height:1.8;
    margin-bottom:20px;
}

img{
    width:100%;
    border-radius:10px;
    margin:20px 0;
}

.back-btn{
    display:inline-block;
    margin-top:20px;
    padding:12px 24px;
    background:#8b4513;
    color:white;
    text-decoration:none;
    border-radius:8px;
    font-weight:bold;
}

.back-btn:hover{
    background:#ffd700;
    color:black;
}

</style>
</head>

<body>

<header>
    <h1>Traditional Kerala Architecture</h1>
</header>

<div class="content">

    <h2>Nalukettu</h2>

    <p>
        Nalukettu is a traditional Kerala house built around
        a central courtyard called the Nadumuttam.
    </p>

    <img src="nalukettu.jpg" alt="Nalukettu">

    <p>
        Kerala architecture is known for sloping roofs,
        wooden carvings, natural ventilation and beautiful
        courtyards.
    </p>

    <a href="index.html" class="back-btn">← Back to Home</a>

</div>

</body>
</html>
